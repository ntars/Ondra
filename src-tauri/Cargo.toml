[package]
name = "ondra"
version = "2.0.1"
description = "空谷 Ondra：全插件式桌面 AI 陪伴体应用"
authors = ["Ntarstudio（星玖工作室）"]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/ntars/Ondra"
homepage = "https://ai.ntars.cn/"

# 不声明 [lib]：空谷只出桌面端（dmg / app / nsis）。
# Tauri 的 lib + cdylib 结构是为移动端准备的——iOS / Android 需要把 Rust
# 编成一个被原生工程链接的动态库。桌面端只要一个二进制，多这一层只会让
# 入口分成 main.rs 与 lib.rs 两处、编译产物翻倍。

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步运行时：宿主进程的 stdio 读写与超时控制都在异步上下文里，
# 用 tokio 而不是手写线程，避免自己实现唤醒与超时。
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }

[profile.release]
# 安装包体积优先：桌面应用不需要调试符号，LTO 与 strip 能显著缩小二进制。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
