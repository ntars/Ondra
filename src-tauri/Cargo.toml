[package]
name = "ondra"
version = "1.1.6-alpha"
description = "空谷 Ondra：全插件式桌面 AI 陪伴体应用"
authors = ["Ntarstudio（星玖工作室）"]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/ntars/Ondra"
homepage = "https://ai.ntars.cn/"

# lib + bin 双入口。桌面端与移动端共用同一份 lib.rs。
#
# ## 为什么现在必须有 [lib]
#
# 上一版这里的注释写着「不声明 [lib]：空谷只出桌面端」——那时候是对的。
# 现在要出 Android 包，而 Android **不能**直接运行一个可执行文件：系统把
# Rust 编成 cdylib（`libondra.so`），由 Kotlin 侧的 Activity 通过 JNI 加载。
# 没有 [lib] 就没有那个 .so，`tauri android build` 会在链接阶段报
# 「library not found for -londra」。
#
# ## 为什么 crate-type 是 ["staticlib", "cdylib", "rlib"] 三个
#
# 三个平台要的东西不同：
#   - `cdylib`  → Android / iOS 要的动态库
#   - `staticlib` → iOS 静态链接用（留在这，避免以后为 iOS 再改一次）
#   - `rlib`    → 桌面端的 bin 要 `use ondra::run()`，这是 Rust 内部链接
# 少写 `rlib` 时，桌面端的 `main.rs` 无法引用同 crate 的 lib，只能把整份
# 逻辑复制一遍——两份真源必然漂移。
[lib]
name = "ondra"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ondra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.2"
# 系统通知（§12.10）。只在「窗口不可见时她主动开口」这一处用。
# 不自己写平台通知代码：三个平台各有一套权限模型与通知中心协议，
# 自己实现等于把 macOS 的 UNUserNotificationCenter、Windows 的 Toast
# 与 Linux 的 D-Bus 各写一遍，收益为零。
tauri-plugin-notification = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步运行时：宿主进程的 stdio 读写与超时控制都在异步上下文里，
# 用 tokio 而不是手写线程，避免自己实现唤醒与超时。
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }

# macOS 自绘红绿灯：需要把系统的三个 standardWindowButton 藏掉。
# 按 target 分条件声明，Windows / Linux 构建不会拉进 AppKit 依赖。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSWindow", "NSButton", "NSView", "NSResponder"] }

# 进程组信号：退出时要把宿主与它拉起的 dsh-sidecar 一起收掉。
# 只声明 kill(2) 需要的常量与函数，不引 nix——为一个信号拉一整套绑定不值得。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# 安装包体积优先：桌面应用不需要调试符号，LTO 与 strip 能显著缩小二进制。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
