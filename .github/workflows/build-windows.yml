name: Build Windows Installer

# 在 GitHub 托管的 Windows x64 运行器上构建未签名安装包，并上传为构建工件。
# 构建步骤与 docs/BUILD_WINDOWS.md 保持一致，差异仅在于环境文件由仓库变量注入。

on:
  workflow_dispatch:
    inputs:
      compression:
        description: '安装器压缩等级（3 更快，7 更小）'
        required: false
        default: '3'
        type: choice
        options:
          - '3'
          - '7'

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      ONDRA_CLIENT_COMMIT_HASH: ${{ github.sha }}
      ONDRA_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN: ${{ vars.ONDRA_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN || 'https://ai.ntars.cn' }}
      ONDRA_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN: ${{ vars.ONDRA_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN || 'https://ai.ntars.cn' }}
      # 测试部署（ONDRA_DESKTOP_AUTO_UPDATE_ENV=test）在打包准备阶段强制要求
      # allowedAuthOrigins 非空，否则 package-target 直接以
      # "test policy requires nonempty allowedAuthOrigins" 退出。
      ONDRA_DESKTOP_MANDATORY_UPDATE_CONFIG: '{"allowedAuthOrigins":["https://ai.ntars.cn"]}'

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: 生成打包环境文件
        working-directory: desktop/apps/desktop
        shell: pwsh
        run: |
          $lines = @(
            'ONDRA_DESKTOP_APP_ID=com.ntars.ondra',
            'ONDRA_DESKTOP_AUTO_UPDATE_ENV=test',
            "ONDRA_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=$env:ONDRA_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN",
            "ONDRA_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=$env:ONDRA_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN",
            "ONDRA_DESKTOP_MANDATORY_UPDATE_CONFIG='$env:ONDRA_DESKTOP_MANDATORY_UPDATE_CONFIG'",
            "ONDRA_DESKTOP_WINDOWS_COMPRESSION_LEVEL=${{ inputs.compression }}"
          )
          $lines | Set-Content -LiteralPath .env.windows -Encoding utf8
          Get-Content .env.windows

      - name: 安装工作区依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: 编译并执行质量门禁
        working-directory: desktop
        run: pnpm run build

      - name: 打包 Windows x64 安装程序
        working-directory: desktop
        run: pnpm run package:desktop:win:x64:unsigned

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ondra-win-x64-unsigned
          path: desktop/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
