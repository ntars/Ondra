name: Mac Probe

# 一次性诊断用：验证 macos-14 / macos-latest 这两个标签在本仓库能否真的
# 分配到 runner。release.yml 里的 macOS job 每次都是零步骤被取消，需要用
# 最小工作流把「代码问题」和「平台不分配 runner」区分开。
# 诊断完即删，不参与发布。

on:
  workflow_dispatch:

jobs:
  probe14:
    name: probe macos-14
    runs-on: macos-14
    steps:
      - name: 打印基本信息
        run: uname -a && sw_vers

  probe_latest:
    name: probe macos-latest
    runs-on: macos-latest
    steps:
      - name: 打印基本信息
        run: uname -a && sw_vers
