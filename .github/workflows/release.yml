# 三端发布构建（GitHub Actions）。
#
# 为什么需要它：Windows 桌面目标只能在 Windows 上构建（MSVC 没有交叉编译，
# 没有别的办法）。macOS job 也放进来，是为了让三端产物出自同一份提交，
# 免得本机与 CI 的 Flutter 版本漂移出不一致的包。
#
# 用法：
#   1. 推一个 `v*` 的 tag：三个 job 构建完，自动挂到该 tag 的发行版上；
#      发行版已存在（比如先手工写了说明）就只补资产，不覆盖说明。
#   2. 或者 Actions → Release build → Run workflow：只出 Artifacts，不动发行版。
#
# 说明：
#   - 三个 job 都没有签名步骤：APK 是 debug 签名，侧载能装；Windows 未签名
#     会被 SmartScreen 提示，点「仍要运行」；macOS 是 ad-hoc 签名，首次打开
#     要右键 →「打开」。这是 alpha 阶段的选择，正式分发要另配 keystore 与公证。
#   - APK 不能靠解压再压缩来「剔架构」：v2 签名覆盖整个文件，改完就装不上。
#     单架构包只能重新构建，靠 Gradle 缓存，第二次很快。
name: Release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    # 装配要上一次 npm 装内核（解压后约 900MB）+ 拷 6000 个文件，
    # 再加上 Flutter 首次构建，20 分钟内能完；给三倍余量以免被 runner 抖动打断。
    timeout-minutes: 60
    env:
      # 与开发机同版本的内核。CI 打出的包必须和本地验证过的那份一致，
      # 否则「测试过 A、发出去 B」——升级内核时改这里，并在本机重跑一次装配。
      DSH_VERSION: "0.2.2-rc.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 装配从「全局安装的内核」里提取依赖闭包，所以必须先装一份。
      - name: 装内核（装配的闭包来源）
        shell: pwsh
        run: |
          npm install -g "@deepseek-ai/dsh@$env:DSH_VERSION"
          npm root -g

      # 这一步同时是 Windows 分支**唯一的执行机会**：junction 建链、tar.exe
      # 解压 sqlite3、`node.exe` 命名、以及最后的真握手自检，都只在这里跑得到。
      # 自检失败会让 job 直接红——这正是要的：宁可不出包，也不要出一个
      # 双击连不上内核的包。
      - name: 装配随包运行时
        shell: pwsh
        run: node tool/assemble_runtime.mjs

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      # CMake 在缺运行时时会 FATAL，但那是构建期的检查。这里再验一次
      # **产物**：有人把 CMake 的 install 规则改坏、或运行时被装到了别处，
      # 构建照样成功，包却是空的。
      - name: 校验产物里带运行时
        shell: pwsh
        run: |
          $rt = "build/windows/x64/runner/Release/runtime/windows-x64"
          if (-not (Test-Path "$rt/node.exe")) {
            throw "构建产物里没有运行时：$rt/node.exe"
          }
          if (-not (Test-Path "$rt/sqlite3.exe")) {
            throw "构建产物里没有 sqlite3.exe——状态面板与记忆星图会安静地显示没数据"
          }
          if (-not (Test-Path "$rt/dsh/lib/bin.js")) {
            throw "构建产物里没有内核入口：$rt/dsh/lib/bin.js"
          }
          Get-ChildItem $rt | Select-Object Name, Length

      - name: Package
        shell: pwsh
        run: |
          # Release 目录是裸 exe + 一堆 dll + data/，必须整目录一起带，
          # 少一个 dll 双击就起不来。
          $tag = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "Ondra-$tag-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Ondra-*-windows-x64.zip

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: 解码签名密钥
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/ondra-release.jks
          cat > android/key.properties <<KEYPROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=ondra-release.jks
          KEYPROPS
      - name: Build arm64
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk \
            "空谷 Ondra-${GITHUB_REF_NAME#v}-android-arm64.apk"
      - name: Build universal
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "空谷 Ondra-${GITHUB_REF_NAME#v}-android-universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: "*android-*.apk"

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DSH_VERSION: "0.2.2-rc.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 装内核（装配的闭包来源）
        run: npm install -g "@deepseek-ai/dsh@$DSH_VERSION"

      - name: 装配随包运行时
        run: node tool/assemble_runtime.mjs

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      # 必须走 bundle_macos.sh，不能直接 `flutter build`：Dart 产物不会把仓库
      # 根下的 runtime/ 带进 .app，而往 .app 里加文件又会让签名失效。这两件事
      # 脚本一起做完了（复制 + 重签 + 校验）。
      - name: 构建并塞入运行时
        run: ./tool/bundle_macos.sh

      - name: Package
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="build/macos/Build/Products/Release/空谷 Ondra.app"
          # --norsrc --noextattr：不带资源叉。用 --sequesterRsrc 的话解压端会
          # 多出几百个 ._* 与 __MACOSX/，WinRAR 还会误判压缩包损坏。
          ditto -c -k --norsrc --noextattr --keepParent "$app" \
            "Ondra-$tag-macos-universal.zip"
          # dmg 用 udzo 压缩，20 MB 上下；不签名，只有链接器的 ad-hoc 签名。
          hdiutil create -volname "空谷 Ondra" -srcfolder "$app" -ov -format UDZO \
            "Ondra-$tag-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Ondra-*-macos-universal.zip
            Ondra-*-macos-universal.dmg

  # 只有 tag 触发才发布；workflow_dispatch 停在 Artifacts，免得误发。
  release:
    needs: [windows, android, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum Ondra-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 预发行版与否由 tag 名决定，不写死。写死 --prerelease 会让正式版
          # 永远抢不到 Latest（GitHub 不允许预发行版设为 Latest）。
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) FLAG="--prerelease" ;;
            *)                      FLAG="--latest" ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "发行版已存在，只上传资产"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes "$FLAG"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
