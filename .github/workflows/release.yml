name: Release Alpha

# 内测版发布：打一个 `v*` tag，两个平台各自构建，最后由 publish 汇总成一个
# 发行版（release）。
#
# ## 为什么 macOS 与 Windows 分成两个 job
#
# Tauri 不能交叉编译：NSIS 安装包必须在 Windows 上由 WiX/NSIS 生成，
# `.app` 必须在 macOS 上签名与打包。两个 job 并行，互不阻塞。
#
# ## 为什么 macOS 那个 job 允许失败
#
# 两个平台的包现在都由这条流水线产出，但 macOS 那份是**可替代**的：
# `pnpm run build:app` 在本机能出等价的 dmg，所以云端 mac 造不出来时不该
# 拦住整条发布——因此它 `continue-on-error`，且 `publish` 只 `needs`
# Windows。（历史上 mac 是最初只在本机构建的，这个 `continue-on-error`
# 就是那时候留下的；现在保留它是因为 mac 侧的失败面比 Windows 大：
# runner 镜像版本、Xcode 版本都由 GitHub 侧决定。）
#
# 注意：两个平台的包**都没有签名、也没有公证**。macOS 是链接器 ad-hoc 签名
# （`codesign -dv` 显示 `flags=0x20002(adhoc,linker-signed)`，`TeamIdentifier`
# 未设置），Windows 没有代码签名证书。签名与公证是正式版阶段的工作。
#
# ## 为什么发布要单独一个 job
#
# 两个构建 job 各自往同一个 release 上传资产会打架（先后创建同一个 tag
# 的 release）。汇总成一个 job 之后，「release 存在」这件事只有一个写入点，
# 资产在它之前先落成 artifact。
#
# ## 为什么不再标 Pre-release
#
# GitHub 的硬规则：Latest 不能是 draft 或 prerelease——API 直接回 422
# `Latest release cannot be draft or prerelease`。而仓库首页右栏的「发行版」
# 区块**只列 Latest**，标了 Pre-release 的 release 在那里只是一行「N tags」，
# 点不进任何一个版本。也就是说：想让人在首页直接看到并且能下载，就不能带
# 这个标记。
#
# 代价是 GitHub 不再从徽章上区分内测与稳定。内测的语义改由**版本号**承载：
# `-alpha` 后缀、标题里的「内测版」、正文第一段。版本号从 `1.0.x-alpha` 跳到
# `1.0.x` 或 `2.x` 仍然是**人工动作**，不在这条流水线里。
#
# ## 版本号从哪来
#
# 真源是 `package.json`。tag 与它不一致时第一步就失败——否则会出现
# 「包里写着 1.0.2、release 标题写着 1.0.1」这种对不上账的发布。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（例如 v1.1.0-alpha）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: macOS (arm64)
    # 不要改成钉死的 `macos-14`。
    #
    # 那个标签在 2026-11 前后已不再分配 runner，但 GitHub 不报错：job 会在
    # 0 秒、0 步骤、没有 runner 的状态下被直接标成 cancelled，日志一个字
    # 都没有，看上去像流水线自己出错。用一次性探针工作流对比同一时刻的两次
    # 分配才确认——`macos-14` 取消，`macos-latest` 正常拿到 macOS 26 arm64。
    #
    # `macos-latest` 由 GitHub 跟进当前默认大版本，代价是升级时环境会变；
    # 这个 job 只是备份产物，跟进收益大于钉版本的可复现性。
    runs-on: macos-latest
    timeout-minutes: 120
    # 见文件头：云端 mac 包是备份，不是发布的必要条件。
    continue-on-error: true

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 与 tauri 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 校验版本号与 tag 一致
        run: |
          node -e "
            const tag = process.env.ONDRA_RELEASE_TAG.replace(/^v/, '');
            const { version } = require('./package.json');
            if (version !== tag) {
              console.error('版本不一致：package.json=' + version + '，tag=' + tag);
              process.exit(1);
            }
          "
        # 变量名**不能**叫 GITHUB_REF_NAME。GITHUB_ 前缀由 GitHub 保留：
        # step 的 env 里写它会被静默忽略，runner 照样把 GITHUB_REF_NAME 设成
        # 当前 ref（workflow_dispatch 时是 `main`），于是校验永远拿 `main`
        # 去比 `1.0.1-alpha` 而失败。日志的 env 块里显示的却是我们写的值，
        # 很难看出问题——踩过一次，记在这里。
        env:
          ONDRA_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: 编译前端、插件、宿主与内核
        run: pnpm run build

      - name: 收集运行时
        run: pnpm run build:runtime

      - name: 打包 .app
        run: node tools/tauri-build.mjs

      - name: 生成 dmg
        run: node tools/make-dmg.mjs

      - name: 上传 dmg 工件
        uses: actions/upload-artifact@v4
        with:
          name: ondra-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 与 tauri 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 校验版本号与 tag 一致
        run: |
          node -e "
            const tag = (process.env.ONDRA_RELEASE_TAG || '').replace(/^v/, '');
            const { version } = require('./package.json');
            if (version !== tag) {
              console.error('版本不一致：package.json=' + version + '，tag=' + tag);
              process.exit(1);
            }
          "
        # 变量名**不能**叫 GITHUB_REF_NAME。GITHUB_ 前缀由 GitHub 保留：
        # step 的 env 里写它会被静默忽略，runner 照样把 GITHUB_REF_NAME 设成
        # 当前 ref（workflow_dispatch 时是 `main`），于是校验永远拿 `main`
        # 去比 `1.0.1-alpha` 而失败。日志的 env 块里显示的却是我们写的值，
        # 很难看出问题——踩过一次，记在这里。
        env:
          ONDRA_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: 编译前端、插件、宿主与内核
        run: pnpm run build

      - name: 收集运行时
        run: pnpm run build:runtime

      - name: 打包安装程序
        run: node tools/tauri-build.mjs

      - name: 上传安装包工件
        uses: actions/upload-artifact@v4
        with:
          name: ondra-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android (arm64 APK)
    # 为什么是 ubuntu 而不是 macos：安卓打包只需要 JDK + SDK + NDK，
    # 三样在 Linux 上都有官方发行版，而 Linux runner 的分钟费是 mac 的
    # 十分之一。这个 job 要跑 Gradle，比两个桌面 job 都慢，选便宜的。
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # JDK 17 而不是 21/25：Gradle 8.x 对 21+ 的支持看 AGP 版本，
      # 而 Tauri 生成的工程用的是 AGP 8.x，17 是它的默认目标。
      # 装 25 会在 `:app:compileReleaseJavaWithJavac` 报
      # 「Unsupported class file major version」。
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      # NDK 版本必须与 Tauri 期望的一致。写死一个具体版本而不是 `latest`：
      # NDK 的 r26 → r27 改过 libc++ 的链接方式，版本漂移会让「昨天能编、
      # 今天不能」变成一道无从查起的谜题。
      - name: 安装 Android NDK 与构建工具
        run: |
          sdkmanager --install \
            "ndk;27.0.12077973" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: 安装 Rust 工具链与 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 与桌面端分开缓存：目标架构不同，混在一起会让缓存命中率归零。
          shared-key: android

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 校验版本号与 tag 一致
        run: |
          node -e "
            const tag = process.env.ONDRA_RELEASE_TAG.replace(/^v/, '');
            const { version } = require('./package.json');
            if (version !== tag) {
              console.error('版本不一致：package.json=' + version + '，tag=' + tag);
              process.exit(1);
            }
          "
        env:
          ONDRA_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

      # 前端必须先编出来：Tauri 的 beforeBuildCommand 会在 android build 时
      # 再跑一次，但那次跑的是主配置里的 `pnpm run build:web`（非本地模式），
      # 而安卓必须走 `build:mobile`（ONDRA_LOCAL=1）。
      # tauri.android.conf.json 已经把 beforeBuildCommand 覆盖成 build:mobile，
      # 这里再显式跑一次是为了让失败点落在「编译前端」而不是 Gradle 深处。
      - name: 编译前端（本地模式）
        run: pnpm run build:mobile

      # 只初始化一次。gen/ 在 .gitignore 里，所以 CI 每次都要重新 init。
      # `--ci` 跳过所有交互提问（不跳会卡在「用哪个包名」上直到超时）。
      - name: 初始化 Android 工程
        run: pnpm exec tauri android init --ci

      # 只出 aarch64 一个架构：全架构的 universal APK 约 185 MB，
      # 而 arm64 单架构约 40 MB。GitHub Release 单文件上限 100 MB，
      # 全架构包会直接上传失败。手机端现在 99% 是 arm64。
      - name: 打包 APK
        run: pnpm exec tauri android build --apk --target aarch64

      # 产物路径随 Tauri 版本变过两次（apk/release → apk/universal/release）。
      # 用 find 找而不是写死路径：路径错了会静默上传一个空工件。
      - name: 找到 APK
        id: find-apk
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::没有找到 APK，构建可能静默失败"
            find src-tauri/gen/android/app/build/outputs -type f | head -50
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: 上传 APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: ondra-android
          path: ${{ steps.find-apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 发布发行版
    # 等三个平台都结束再发布。
    #
    # 原来只写 `needs: [windows]`：macOS 那个 job 带 `continue-on-error`，
    # 不放进 needs 就不会被等——publish 完全可能在 macOS 还没传完工件时就
    # 去下载，于是正文少一条链接、release 少一个包，而且不报错。现在 macOS
    # 已经能在云端跑通，就该等它。Android 同理。
    #
    # `always()` 是必需的：`needs` 里任何一个 job 失败或被取消，dependent
    # job 默认直接跳过。macOS 或 Android 失败时我们仍要发 Windows 那一份，
    # 所以只要 Windows 成功就继续——另两份缺了就少一行链接，由正文的
    # glob 自动处理（只为实际存在的文件生成行）。
    needs: [windows, mac, android]
    if: "always() && needs.windows.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 下载两个平台的工件
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: 列出待发布资产
        run: ls -lh dist-assets

      - name: 资产改成可读名
        # 两件事一起做。
        #
        # 一、去掉非 ASCII。GitHub 会把资产名里的中文直接洗掉：「空谷 Ondra_x.dmg」
        # 存进去就变成「Ondra_x.dmg」。由此产生一个很难看的坑——
        # softprops/action-gh-release 的覆盖逻辑是「按本地文件名去已上传资产里
        # 找同名的，找到就先删再传」。它拿中文原名去找，永远找不到洗过之后的
        # 名字，于是不删；上传之后 GitHub 又洗一次，撞 already_exists 整步失败。
        #
        # 二、换成一眼能看出平台与架构的名字。tauri 的默认名
        # `Ondra_1.0.1-alpha_aarch64.dmg` 里既没有 "mac"，也没有 "arm"，
        # 而 `.exe` 那边写的是 x64——下载页上「哪个是我的」不该靠猜。
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import glob, os, re, shutil
          tag = os.environ['TAG']
          ver = tag[1:] if tag.startswith('v') else tag
          # 同义写法归一：aarch64/arm64 都算 arm64，x86_64/amd64/x64 都算 x64。
          arch_map = {'aarch64': 'arm64', 'arm64': 'arm64',
                      'x86_64': 'x64', 'amd64': 'x64', 'x64': 'x64'}
          os.makedirs('upload', exist_ok=True)
          for path in sorted(glob.glob('dist-assets/*')):
              if os.path.isdir(path):
                  continue
              base = os.path.basename(path)
              low = base.lower()
              m = re.search(r'(aarch64|x86_64|amd64|x64|arm64)', low)
              arch = arch_map.get(m.group(1), 'x64') if m else 'x64'
              if low.endswith('.dmg'):
                  name = f'Ondra-{ver}-macos-{arch}.dmg'
              elif low.endswith('.exe'):
                  name = f'Ondra-{ver}-windows-{arch}-setup.exe'
              elif low.endswith('.apk'):
                  # APK 的架构由构建参数决定（CI 只出 aarch64），文件名里
                  # 通常不带架构字样，所以这里直接写死 arm64 而不是从名字里猜。
                  name = f'Ondra-{ver}-android-arm64.apk'
              else:
                  print(f'跳过（不认识的文件类型）: {base}')
                  continue
              shutil.copy2(path, os.path.join('upload', name))
              print(f'{base} -> {name}')
          PYEOF
          ls -l upload

      - name: 清掉同 tag 的残留草稿
        # 上一次发布中途失败时，action-gh-release 会留下一条同 tag 的空草稿。
        # 它不会出现在公开页面上，但会让「按 tag 取 release」的接口与工具有时
        # 取到那个空壳（`gh release view <tag>` 就取错过，看起来像资产丢了）。
        # 这里先删干净再发布，保证同一个 tag 只对应一条 release。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['TAG']
          out = subprocess.run(['gh', 'api', f'repos/{repo}/releases?per_page=100'],
                               capture_output=True, text=True, check=True).stdout
          for rel in json.loads(out):
              if rel['draft'] and rel['tag_name'] == tag:
                  print('删除残留草稿', rel['id'])
                  subprocess.run(['gh', 'api', '-X', 'DELETE',
                                  f'repos/{repo}/releases/{rel["id"]}'], check=True)
          PYEOF

      - name: 生成 release 正文
        # 正文里直接给下载链接。默认的 Assets 区在页面最底部，缩成一行行
        # 小字；「下载」应该是打开页面第一眼就能做的事。
        #
        # 只为**实际存在**的文件生成行：云端 macOS 是可选备份，跑失败了
        # 也不该在正文里留一条点进去 404 的链接。
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import glob, os
          tag = os.environ['TAG']
          ver = tag[1:] if tag.startswith('v') else tag
          repo = os.environ['GITHUB_REPOSITORY']
          base = f'https://github.com/{repo}/releases/download/{tag}'
          rows = []
          for pattern, label in (('*.dmg', 'macOS（Apple Silicon）'),
                                 ('*.exe', 'Windows（x64）'),
                                 ('*.apk', 'Android（arm64）')):
              for path in sorted(glob.glob('upload/' + pattern)):
                  name = os.path.basename(path)
                  size = os.path.getsize(path) / (1024 * 1024)
                  rows.append(f'| {label} | [`{name}`]({base}/{name}) | {size:.1f} MB |')
          if not rows:
              rows = ['| — | 本次构建没有产出可下载的包 | — |']
          lines = [
              f'## 下载 `{ver}`',
              '',
              '| 平台 | 安装包 | 大小 |',
              '| --- | --- | --- |',
          ]
          lines += rows
          lines += [
              '',
              '内测版：版本号末尾的 `-alpha` 就是标记。不是公测版，也不是正式版。',
              '',
              '### 首次打开会被系统拦下',
              '',
              '**三个包都没有正式签名**（macOS 是链接器 ad-hoc 签名，Windows 没有代码签名证书，Android 是 debug 签名）。',
              '',
              '- **macOS**：右键点应用 →「打开」；或执行',
              '  `xattr -dr com.apple.quarantine "/Applications/空谷 Ondra.app"`',
              '- **Windows**：SmartScreen 提示时点「更多信息」→「仍要运行」',
              '- **Android**：系统会提示「未知来源」。允许浏览器/文件管理器安装即可；',
              '  这个包只支持 arm64（近几年的手机都是），老设备装不上是正常的。',
              '',
              '### 装完之后',
              '',
              '桌面端首次启动会拉起本机的插件宿主与内核，自带 Node 运行时，不需要另装。',
              '**安卓端不跑 Node**：记忆与情绪在 WebView 里用 IndexedDB 直接算，',
              '推理直连你在设置里填的接口，所以 APK 只有几十 MB，也不需要额外依赖。',
              '数据全部留在本机，无账号、无遥测。推理来源在设置里三选一：在线接口 / 本地大模型 / 免费模型。',
              '',
              f'完整变更见 [README 的更新日志](https://github.com/{repo}/blob/main/README.md)。',
          ]
          body = '\n'.join(lines) + '\n'
          open('release-body.md', 'w', encoding='utf-8').write(body)
          print(body)
          PYEOF

      - name: 创建发行版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: '空谷 Ondra ${{ github.event.inputs.tag || github.ref_name }}（内测版）'
          # false 不是笔误。标了 pre-release 就进不了「Latest」，仓库首页的
          # 「发行版」区块就只剩一行「N tags」——那样没人能在首页看到并下载。
          # 内测语义由版本号的 `-alpha` 与标题里的「内测版」承载。
          prerelease: false
          draft: false
          # 不要求两个平台都齐：macOS 那份是可替代的（本机 `build:app` 也能
          # 出等价的 dmg），云端跑失败时只发 Windows 那一份也是好的。要求
          # 「文件必须都匹配上」会在只有 exe 时直接失败。
          fail_on_unmatched_files: false
          # 正文由上一步生成，含各平台的直链下载表。
          body_path: release-body.md
          files: |
            upload/*.dmg
            upload/*.exe
            upload/*.apk
