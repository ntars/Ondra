# 安卓模拟器探针：真机白屏（alpha.10 反馈）无法用本地 adb 复现——
# 这里用 GitHub runner 的 AVD 当"adb"，把安装、启动、logcat 全程抓下来。
#
# 触发方式：workflow_dispatch（手动），输入 apk 路径（默认取最新 release
# 的 universal 包，它含 x86_64，runner 的模拟器能跑）。
#
# 产出：logcat 与启动时间线的 artifact，供定位白屏根因。
name: android-probe

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'universal apk 的下载地址（留空 = 最新 release）'
        required: false
        default: ''
      boot_wait:
        description: '启动后观察秒数'
        required: false
        default: '45'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取 apk
        run: |
          if [ -z "${{ inputs.apk_url }}" ]; then
            URL=$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/latest \
              | grep -oE '"browser_download_url": *"[^"]*android-universal[^"]*\.apk"' \
              | head -1 | grep -oE 'https[^"]+')
          else
            URL='${{ inputs.apk_url }}'
          fi
          echo "apk: $URL"
          curl -sL "$URL" -o app-universal.apk
          ls -lh app-universal.apk

      - name: 打开 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 安装并启动应用（模拟器由社区 action 管理）
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-no-output: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            ADB=/usr/local/lib/android/sdk/platform-tools/adb
            set -x
            $ADB devices
            for i in $(seq 1 30); do
              B=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n')
              if [ "$B" = "1" ]; then echo "BOOTED at ${i}"; break; fi
              sleep 5
            done
            $ADB install -r app-universal.apk
            $ADB logcat -c
            $ADB shell monkey -p cn.ntars.ai -c android.intent.category.LAUNCHER 1 || \
              $ADB shell monkey -p cn.ntars.ai -c android.intent.category.LAUNCHER 1
            sleep ${{ inputs.boot_wait }}
            $ADB shell "dumpsys activity activities | head -30" || true
            $ADB shell "ps -A | grep -i ondra" || true
            $ADB logcat -d -v time > logcat-full.txt

      - name: 收日志
        if: always()
        timeout-minutes: 3
        run: |
          grep -aiE "flutter|dart|AndroidRuntime|FATAL|ANR |ondra|Crash" logcat-full.txt > logcat-filtered.txt || true

      - name: 上传日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-probe-logs
          path: |
            logcat-full.txt
            logcat-filtered.txt
          if-no-files-found: warn
