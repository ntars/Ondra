# 安卓模拟器探针：真机白屏（alpha.10 反馈）无法用本地 adb 复现——
# 这里用 GitHub runner 的 AVD 当"adb"，把安装、启动、logcat 全程抓下来。
#
# 触发方式：workflow_dispatch（手动），输入 apk 路径（默认取最新 release
# 的 universal 包，它含 x86_64，runner 的模拟器能跑）。
#
# 产出：logcat 与启动时间线的 artifact，供定位白屏根因。
name: android-probe

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'universal apk 的下载地址（留空 = 最新 release）'
        required: false
        default: ''
      boot_wait:
        description: '启动后观察秒数'
        required: false
        default: '45'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取 apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${{ inputs.apk_url }}" ]; then
            # latest 排除 prerelease，而本项目全是 prerelease——按 tag 直接取。
            URL=$(gh release view v3.0.0-alpha.10 --repo ${{ github.repository }} \
              --json assets --jq '.assets[] | select(.name | contains("android-universal")) | .url')
            gh release download v3.0.0-alpha.10 --repo ${{ github.repository }} \
              --pattern "*android-universal*" --output app-universal.apk
          else
            URL='${{ inputs.apk_url }}'
            curl -sL "$URL" -o app-universal.apk
          fi
          echo "apk: $URL"
          curl -sL "$URL" -o app-universal.apk
          ls -lh app-universal.apk

      - name: 打开 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 创建 AVD
        run: |
          AVDM=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager
          echo no | $AVDM create avd -n probe -k "system-images;android-34;google_apis;x86_64" --device pixel_6
          $AVDM list avd | head -6

      - name: 起模拟器并抓日志（一体编排）
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ADB=/usr/local/lib/android/sdk/platform-tools/adb
          $ADB start-server
          set -x
          $ADB install -r app-universal.apk 2>&1 | head -5 || true
          # 起模拟器（后台），日志到文件
          /usr/local/lib/android/sdk/emulator/emulator -avd probe -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on -no-snapshot &
          for i in $(seq 1 60); do
            B=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n')
            if [ "$B" = "1" ]; then echo "BOOTED at ${i}x5s"; break; fi
            sleep 5
          done
          $ADB install -r app-universal.apk
          $ADB logcat -c
          $ADB shell monkey -p cn.ntars.ai -c android.intent.category.LAUNCHER 1
          sleep ${{ inputs.boot_wait }}
          $ADB shell "dumpsys activity activities | head -30" || true
          $ADB shell "ps -A | grep -i ondra" || true
          $ADB logcat -d -v time > logcat-full.txt

      - name: 收日志
        if: always()
        timeout-minutes: 3
        run: |
          grep -aiE "flutter|dart|AndroidRuntime|FATAL|ANR |ondra|Crash" logcat-full.txt > logcat-filtered.txt || true

      - name: 上传日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-probe-logs
          path: |
            logcat-full.txt
            logcat-filtered.txt
          if-no-files-found: warn
