# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# **不写 inject**：写了会连 `ondra-boot-settle` 自己也停在 PENDING——那样
# 名单里的插件没人重启，而且日志里看不出原因。本插件用的是回调式注入
# （`ctx.inject`），服务就绪时才执行，不需要 fiber 级 inject。
#
# 刻意**不写 config**：默认值是「什么都不做」，真名单写在 profile 的装配层里
# （`~/.ondra/dsh/profiles/ondra/cordis.patch.yml`）——那份配置才有资格决定
# 「这台机器上有哪些插件需要补时序」。
- insert:
    - id: ondra-boot-settle
      name: 'ondra-boot-settle'
