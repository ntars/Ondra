# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
#
# 刻意**不写 inject**：`ondra-emotion-express` 是软依赖——它缺席时本插件
# 按正文线索照常工作，只是拿不到回落用的六态。写成 inject 会让整包停在
# PENDING，而"为什么表情总是平静"的答案恰恰就在那个缺席里。
- insert:
    - id: ondra-expression-decide
      name: 'ondra-expression-decide'
