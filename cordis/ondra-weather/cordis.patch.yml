# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`，
# 写进来就等于把同一份默认值抄成两处，改一处忘一处时面板与运行期会各说一套。
#
# 刻意**不写 inject**：`ondra-config-schema` / `ondra-identity` 缺席时，
# 正确表现是「服务照常注册 + 一行告警」，而不是整个插件停在 PENDING——
# 停在 PENDING 会让面板连「缺什么」都读不到，看起来像「天气功能不存在」。
- insert:
    - id: ondra-weather
      name: 'ondra-weather'
