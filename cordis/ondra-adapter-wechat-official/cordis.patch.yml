# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / name 不一致 → 只告警，然后**跳过**。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 这里再抄一份，就会出现「面板显示已开、实际还是关的」这种最难查的分叉。
# `enable` 默认 false 已经写在 FIELD_SPECS 里。
#
# 刻意**不写 inject**：依赖全软（webServer / router / channel-kit / channel-health）。
# 声明 inject 会让缺一个就整包停 PENDING——而这个插件最该做到的事，
# 正是「缺了 webServer 也要在面板上显示：路由没挂上，所以收不到消息」。
# 用 inject 把它藏起来，用户只会看到一个空空的通道列表。
#
# 刻意**不写 disabled**：enable=false 已经让路由静默应答复 `disabled`，
# 服务照常注册、面板能看见「已关闭」。摘掉入口等于让用户失去「它存在但没开」这条信息。
- insert:
    - id: ondra-adapter-wechat-official
      name: 'ondra-adapter-wechat-official'
