# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
#
# 刻意**不写 inject**：`ondra-path-layout` 与 `ondra-persona-core` 全软。
# 没有路径服务还能用 `rootOverride`；没有人设服务就只用共享包与内置包。
# 写成 inject 会让整包停在 PENDING，而"为什么取不到图"恰恰要靠
# 这个插件活着才能被看见。
- insert:
    - id: ondra-sticker
      name: 'ondra-sticker'
