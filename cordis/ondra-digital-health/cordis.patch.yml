# 本插件对宿主入口树的补丁。
#
# 语义（master-plan §8.3-2，全仓 117 份对照确认）：
#   - `insert` 块自身不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 块自身带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / `name` 不一致 → 宿主只告警然后跳过（不报错，也不会加载）。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
#
# 刻意**不写 inject**：三项依赖（时钟 / 路径 / 配置真源）全是软依赖。
# 护栏的价值恰恰在「缺东西时还能起来」——若声明 inject，缺路径服务就会整包停在
# PENDING，那时连「只在内存、重启会清零」这句提示都读不到，正是最需要它的场景失效。
# 缺什么由 `stored` 字段与一行日志说清，不靠 inject 拦。
- insert:
    - id: ondra-digital-health
      name: 'ondra-digital-health'
