# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2，实现在 desktop/vendor/include/src/index.ts 的 applyEntryPatches）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / name 不一致 → 只告警，然后**跳过**。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 inject**：五个上游（身份、配置、时钟、情绪、生活层）全是软依赖，
# 连 `tools` 也是软依赖（器官注册工具时缺它只跳过那一个工具，插件本身照跑）。
# 写成插件级 inject 会让「只想装宿主做实验」的配置永远停在 PENDING，
# 而那种场景恰恰是 ABI 最该先跑起来的地方。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 这里最容易漂的是 `charge-mode`：补丁写死 shadow、代码改成 additive 之后，
# 界面上写着「已真扣」而实际还在记账，两个数都对不上。
#
# 刻意**不写 disabled**：`enable=false` 只是拒绝注册新器官，服务仍注册、遥测仍可查。
- insert:
    - id: ondra-organ-host
      name: 'ondra-organ-host'
