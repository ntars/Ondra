# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2，实现在 desktop/vendor/include/src/index.ts 的 applyEntryPatches）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / name 不一致 → 只告警，然后**跳过**。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 inject**：`ondra-store-sqlite` 缺席时本插件照样 `apply()`、照样注册服务，
# 只是把 `available` 置 false 并给出原因（`no-store`）——没有存储后端就不发指针，
# 但「不发」要能被查到，不能变成「没加载」。写成入口级 inject 会让本插件停在 PENDING
# 且一声不响，那正是手册 §8.3 说的最隐蔽的失败。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 这里最容易漂的是 `mode`：补丁写死 `observe`、代码默认改成 `compact` 之后，
# 界面上写着「只预览」而实际在发指针，两边都对不上。
#
# 刻意**不写 disabled**：`mode: off` 已经能关掉一切，且服务仍注册、账本仍可查。
- insert:
    - id: ondra-zero-residence
      name: 'ondra-zero-residence'
