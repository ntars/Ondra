# 本插件对宿主入口树的补丁。
#
# 语义（master-plan §8.3-2，与 ondra-absence / ondra-screen-sense 同一口径）：
#   - `insert` 块自身不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 块自身带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / `name` 不一致 → 宿主只告警然后跳过（不报错，也不会加载）。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
#
# 刻意**不写 inject**：本插件**一项硬依赖都没有**（身份 / 时钟 / 路径 / 配置全是软依赖）。
#
# 尤其刻意**不接发送链与通道**——事件收件箱最顺手的一步就是「收到就播」，
# 接上之后它就多了一条能自己开口的路径，而那条路径不经过 O-042 的六道闸。
# 本插件只提供 ingest()，连一个 HTTP 监听都不起：接 webhook 是宿主的事。
- insert:
    - id: ondra-webhook-inbox
      name: 'ondra-webhook-inbox'
