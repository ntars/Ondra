# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / name 不一致 → 只告警，然后**跳过**。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
#
# 刻意**不写 inject**：本包不声明 `tools`，因为上游缺席时整插件会停在 PENDING
# （手册 §8.3 的静默失败之一）。注册改走 `useRegistrar()` 注入，
# 没有注册器时服务照常可用——只是模型看不见这些工具。
#
# 刻意**不写 disabled**：enable=false 已经让每个调用返回 disabled，
# 服务照常注册、面板能看见「它存在但没开」。摘掉入口等于让用户失去这条信息。
- insert:
    - id: ondra-device-mcp
      name: 'ondra-device-mcp'
