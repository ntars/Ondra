# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / `name` 不一致 → 宿主只告警然后跳过（不报错，也不会加载）。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 在 patch 里再写一遍等于把默认值抄成两份，宿主升级或本插件改默认值后必然分叉。
#
# 刻意**不写 inject**：`ondra-memory-core` 缺席时本插件的正确表现是
# 「服务照常注册 + 面板能说清 no-memory」，而不是整包停在 PENDING。
# 停在 PENDING 会让 `today()` 都读不到，看起来像「这个功能没装」，
# 而这正是面板要区分「没装」与「装了但记忆库没起来」的两种情形。
- insert:
    - id: ondra-onthisday
      name: 'ondra-onthisday'
