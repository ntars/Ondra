# 本插件对宿主入口树的补丁。
#
# 语义（master-plan §8.3-2，全仓 108 份对照确认）：
#   - `insert` 块自身不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 块自身带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / `name` 不一致 → 宿主只告警然后跳过（不报错，也不会加载）。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 在补丁里再写一遍等于把默认值抄成两份，改一处后必然分叉。
#
# 刻意**不写 inject**：三项依赖（记忆内核 / 快照 / 时钟）全是软依赖。
# 缺席时的正确表现是「少一项能力 + 说清少了什么」（例如没有 O-009 时
# 检查点降级成「只有标签、不能恢复」），而不是整包停在 PENDING——
# 停在 PENDING 会让 `tags()` 都读不到，外观上分不清「没装」与「装了但没起来」。
- insert:
    - id: ondra-memory-git
      name: 'ondra-memory-git'
