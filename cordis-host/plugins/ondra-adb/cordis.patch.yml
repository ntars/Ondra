# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / name 不一致 → 只告警，然后**跳过**。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 这里再抄一份，就会出现「面板显示开了、实际还是关的」这种最难查的分叉。
#
# 刻意**不写 inject**：依赖全软（identity / path-layout / clock / config-schema /
# channel-kit）。声明 inject 会让缺一个就整包停在 PENDING——而这个插件最该做到的事，
# 恰好是「缺了 channel-kit 也要在面板上显示：短信收到了，但没人能把它变成回答」。
#
# 刻意**不写 disabled**：enable=false 已经让轮询根本不启动，
# 服务照常注册、面板能看见「已关闭」。摘掉入口等于让用户失去「它存在但没开」这条信息。
- insert:
    - id: ondra-adb
      name: 'ondra-adb'
