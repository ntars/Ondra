# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：写了就等于把默认值抄成第二份，
# 而默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`（与全仓口径一致）。
#
# 刻意**不写 inject**：本插件消费六个上游（prospective / audit / core / recall /
# humanlike / decay / pool），写进 inject 后只要有一个缺席，整插件就停在 PENDING——
# 用户看到的是「她这轮什么都没想起来」，而日志里只有一行 PENDING。
# 现在的形态是「照常注册 + 缺谁少一块 + degradations 里留痕」。
- insert:
    - id: ondra-prompt-inject
      name: 'ondra-prompt-inject'
