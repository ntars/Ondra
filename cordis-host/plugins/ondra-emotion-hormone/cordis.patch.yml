# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：写了就等于把默认值抄成第二份，
# 而默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`（O-001~O-130 口径一致）。
# 本插件默认关闭（`enable: false`）这件事，就在 `FIELD_SPECS['enable'].default` 里，
# 不在这里再写一遍——写两遍，改一处就会有一半不生效。
#
# 依赖（`ondra-emotion-core` / `ondra-config-schema` / `ondra-identity`）
# **不写进 inject**：写进去会让上游缺席时整插件停在 PENDING（静默不加载），
# 而本插件要的是「照常注册 + 给出厂基线 + 平稳倾向」——
# 下游能区分「没装激素维度」与「装了但读不到情绪」。
- insert:
    - id: ondra-emotion-hormone
      name: 'ondra-emotion-hormone'
