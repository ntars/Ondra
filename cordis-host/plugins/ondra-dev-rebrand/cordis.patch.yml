# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2，实现在 desktop/vendor/include/src/index.ts 的 applyEntryPatches）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / name 不一致 → 只告警，然后**跳过**。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 尤其不写 `display-name`：把「空谷 Ondra」抄进补丁就等于有第二份产品名，
# 上游 `product-name.mjs` 改一次、这里漂一次，而漂移的表现是「审计说名字没问题、
# 菜单还是旧名」——这正是本插件存在的理由，不能自己先犯一遍。
#
# 刻意**不写 inject**：本包对 ondra-identity / ondra-config-schema 全是软依赖，
# 声明成插件级 inject 会让任一上游缺席时整插件停在 PENDING，
# 而本包的降级路径（日志前缀兜底、本地校验）正是它存在的意义。
#
# 刻意**不写 disabled**：`enable=false` 只让 `plan()` 报 `disabled`，
# `spec()` / `audit()` 照常给——规格与审计不是行为，关开关不该关掉查询能力。
- insert:
    - id: ondra-dev-rebrand
      name: 'ondra-dev-rebrand'
