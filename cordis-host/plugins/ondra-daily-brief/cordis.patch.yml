# 本插件对宿主入口树的补丁。
#
# 语义（master-plan §8.3-2，全仓对照确认）：
#   - `insert` 块自身不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 块自身带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / `name` 不一致 → 宿主只告警然后跳过（不报错，也不会加载）。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
#
# 刻意**不写 inject**：六项依赖（时钟 / 身份 / 承诺 / 记忆 / 日期 / 天气）全是软依赖。
# 本插件的价值是「缺了哪段就明说哪段读不到」——若声明 inject，缺天气就会整包停在
# PENDING，那时连「天气没装」这句话都读不到，正是最需要它的场景失效。
#
# 刻意**不写 disabled**：默认开着。它是纯只读的，开着没有副作用；
# 关掉只影响「有人来问时答不答」，不影响任何上游。
- insert:
    - id: ondra-daily-brief
      name: 'ondra-daily-brief'
