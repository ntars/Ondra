# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带目标 id → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带目标 id     → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行   → 必须给 `id`。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：写了就等于把默认值抄成第二份，
# 而默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`（与 O-001~O-019、O-035、O-131、O-140 口径一致）。
#
# 依赖（`ondra-memory-recall` / `ondra-memory-core` / `ondra-path-layout` /
# `ondra-config-schema`）**都不写进 inject**：写进去会让上游缺席时整插件停在 PENDING
# （静默不加载），而本插件要的是「照常注册 + available=false」——
# 下游 `ondra-startup-check` 能区分「没装评估」与「装了但召回不可用」。
#
# 本插件**不注册任何定时器**：评估是「改一次参数跑一次」的手动动作。
# 装了定时器就会每小时白烧一遍全库扫描，而且没人会去看那些报告。
- insert:
    - id: ondra-recall-eval
      name: 'ondra-recall-eval'
