# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2，实现在 desktop/vendor/include/src/index.ts 的 applyEntryPatches）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / name 不一致 → 只告警，然后**跳过**。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 inject**：`ondra-failure-attrib` 缺席时本插件照样 `apply()`、照样注册服务，
# 只是把 `available` 置 false 并给出原因（`no-attrib`）——反射弧要能被查到「为什么没长出来」，
# 而不是变成一条静默的 PENDING。写成入口级 inject 就正好是手册 §8.3 说的那种失败。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 这里最容易漂的是 `reflex-threshold`：补丁写死 3、代码默认改成 2 之后，
# 界面上写着「三次成反射」而实际两次就写，两边都对不上。
#
# 刻意**不写 disabled**：`enable: false` 已经能关掉一切，且服务仍注册、账本仍可查。
- insert:
    - id: ondra-reflex
      name: 'ondra-reflex'
