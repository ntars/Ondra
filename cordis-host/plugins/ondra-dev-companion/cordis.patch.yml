# 本插件对宿主入口树的补丁。
#
# 语义（master-plan §8.3-2，全仓 121 份对照确认）：
#   - `insert` 块自身不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 块自身带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / `name` 不一致 → 宿主只告警然后跳过（不报错，也不会加载）。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
#
# 刻意**不写 inject**：本插件**一项硬依赖都没有**。尤其不把 O-109 写成硬依赖——
# 写成硬依赖之后，没装感知插件的机器上它会整包不加载，而它其实只是少一层门。
#
# 也刻意**不接主动发送**：`cue()` 只产出文本，发不发归 O-042 的六道闸。
# 接上发送之后，它就多了一条能自己开口的路径，而那条路径不经过任何一道闸。
- insert:
    - id: ondra-dev-companion
      name: 'ondra-dev-companion'
