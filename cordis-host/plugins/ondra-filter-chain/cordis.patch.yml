# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：写了就等于把默认值抄成第二份，
# 而默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`（与全仓口径一致）。
#
# 刻意**不写 inject**：本插件要读四个上游（persona-core / emotion-stage /
# emotion-express / llm-gateway），写进 inject 后只要有一个缺席，整插件就停在 PENDING。
# 而缺一个上游的正确表现是「少一步过滤」，不是「她的话原样发出去」——
# 后者会让客服腔与旁白直接进到用户眼前。现在的形态是照常注册 + 缺谁少一步。
- insert:
    - id: ondra-filter-chain
      name: 'ondra-filter-chain'
