# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2，实现在 desktop/vendor/include/src/index.ts 的 applyEntryPatches）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / name 不一致 → 只告警，然后**跳过**。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 尤其不写 `rangeStart` / `rangeEnd`：把 9060/9079 抄进补丁就等于有两份默认值，
# 一份漂移就会让「我以为在 9060–9079 里挑」变成挑到别的号，而且没有任何报错。
#
# 刻意**不写 inject**：本包对 ondra-identity / ondra-config-schema / ondra-clock 全是
# 软依赖，宿主 `webServer` 更是可能根本没装——本包的 `system` 分支不依赖它。
# 声明成插件级 inject 会让宿主一缺席整插件停在 PENDING，而「宿主没有 webServer 也能
# 挑端口」正是它存在的意义。
#
# 刻意**不写 disabled**：`enable=false` 只拒绝 `pick()`，账本与只读方法照常可用。
- insert:
    - id: ondra-port-picker
      name: 'ondra-port-picker'
