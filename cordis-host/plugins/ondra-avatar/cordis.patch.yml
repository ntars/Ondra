# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 写了就等于把默认值抄第二份，改一处不生效而另一处生效。
#
# 刻意**不写 inject**：七个依赖全软。声明 inject 会让缺一个就整包停 PENDING，
# 而「为什么立绘是空的」的答案恰恰就在那个缺席里——服务照常注册、
# 帧照常产出，只是 provider 会是 static 或 none，并给出原因码。
#
# 刻意**不写 disabled**：默认开着才有意义（关掉等于插件不存在）；
# 用户要关请在配置里写 enable=false，那时面板还能看见"已关闭"。
- insert:
    - id: ondra-avatar
      name: 'ondra-avatar'
