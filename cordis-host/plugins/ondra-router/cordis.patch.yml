# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
# 写了就等于把默认值抄成两份，改一处不生效而另一处生效。
#
# 刻意**不写 inject**：本插件没有硬依赖。它只认 `apply(ctx)` 里现取的
# `ondra-config-schema` / `ondra-clock` / `ondra-identity` 三个软依赖。
# 声明 inject 会让缺一个就整包停在 PENDING——而「为什么通道不回消息」
# 的答案恰恰要从日志里读出来，插件没装载就连日志都没有。
#
# 刻意**不写 disabled**：默认开着才有意义（关掉等于这个公共层不存在）。
# 用户要关请写配置 `enable=false`，那时服务照常注册、面板还能看见「已关闭」。
- insert:
    - id: ondra-router
      name: 'ondra-router'
