# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2，实现在 desktop/vendor/include/src/index.ts 的 applyEntryPatches）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / name 不一致 → 只告警，然后**跳过**。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
#
# 刻意**不写 inject**：本包对 ondra-identity / ondra-config-schema / ondra-clock 全是软依赖，
# 声明成插件级 inject 会让任一上游缺席时整插件停在 PENDING（手册 §8.3 的静默失败之一）。
# 尤其本包的职责就是「验加载」——它自己因为缺上游而 PENDING，等于把尺子也弄丢了。
#
# 刻意**不写 disabled**：enable=false 只让检查不跑，服务照常注册、`status().reason`
# 如实报 disabled——关掉一个自检不该让界面看不见它存在。
- insert:
    - id: ondra-startup-check
      name: 'ondra-startup-check'
