# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组；本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 目标不存在 / 不是 group / name 不一致 → 只告警，然后**跳过**。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`。
#
# 刻意**不写 inject**：本包只挂 `tools/pre-execute` 与 `tools/post-execute` 两个事件，
# 用的是 `ctx.on()`，不取 `tools` 服务。声明 `inject: ['tools']` 会让上游缺席时
# 整插件停在 PENDING（手册 §8.3 的静默失败之一），而护栏装不上时最坏结果只是「不拦」，
# 不该因此让整个插件不加载。
#
# 刻意**不写 disabled**：enable=false 时本包不挂监听、不拦不裁，但服务照常注册——
# 面板要能回答「护栏装了吗、浏览器后端是哪个」。摘掉入口等于让用户失去这条信息。
- insert:
    - id: ondra-browser
      name: 'ondra-browser'
