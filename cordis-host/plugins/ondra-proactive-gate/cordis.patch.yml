# 本插件对宿主入口树的补丁。
#
# 语义（手册 §8.3-2）：
#   - `insert` 不带 `id` → 追加到根入口列表（本插件用这一种，它是独立根插件）。
#   - `insert` 带 `id`   → 目标是 `group: true` 的分组，本插件不往别人的组里塞。
#   - 无 `insert` 的补丁行 → 必须给 `id`。
#   - 入口字段只有六个：id / name / config / group / disabled / inject。
#
# 刻意**不写 config**：写了就等于把默认值抄成第二份，
# 而默认值的唯一真源是 `src/settings.ts` 的 `FIELD_SPECS`（与全仓口径一致）。
#
# 刻意**不写 inject**：路径服务（O-002）缺席时正确表现是
# 「状态只在内存里 + 一条告警」，而不是「整个插件停在 PENDING」——
# 停在 PENDING 会让调用方拿不到 `gate()`，主动行为直接消失且没有原因码。
- insert:
    - id: ondra-proactive-gate
      name: 'ondra-proactive-gate'
