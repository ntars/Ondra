# Replay-backed goal patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: llm-replay
      name: '@ntars/ondra-llm-replay'
      config:
        providers:
          - id: deepseek-official

- id: session-log-deepseek
  config:
    enabled: false

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.ONDRA_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
