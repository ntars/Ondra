- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@ntars/ondra-host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.ONDRA_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: ondra-telemetry-test
        serviceVersion: !!js process.env.ONDRA_APP_VERSION
        compression: gzip
        scheduledDelayMillis: 60000

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.ONDRA_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
