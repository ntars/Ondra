- name: '@ntars/ondra-llm'
- name: '@ntars/ondra-session'
- name: '@ntars/ondra-session-projection'
- name: '@ntars/ondra-system-prompt'
- name: '@ntars/ondra-tools'
- name: '@ntars/ondra-tool-executor-native'
- name: '@ntars/ondra-agent'
- name: '@ntars/ondra-agent-loop'
  config:
    agents: []
- name: '@ntars/ondra-credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@ntars/ondra-llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@ntars/ondra-llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
