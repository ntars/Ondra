# The ondra base bundle patch: the shared core of each base-backed profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: tool-plugin-manager
      name: '@ntars/ondra-plugin-manager/tools'
      disabled: true

    - id: plugin-manager
      name: '@ntars/ondra-plugin-manager'
      disabled: !!js "!ctx.get('profileContext')"

    - id: timer
      name: '@ntars/cordis-plugin-timer'

    # Profile configuration reloads by default; module roots are opt-in.
    - id: hmr
      name: '@ntars/ondra-hmr'
      disabled: true
      config:
        root: []

    - id: llm
      name: '@ntars/ondra-llm'

    - id: deepseek-llm-api-extensions
      name: '@ntars/ondra-deepseek-llm-api-extensions'

    - id: session
      name: '@ntars/ondra-session'

    - id: session-log-deepseek
      disabled: true
      name: '@ntars/ondra-session-log-deepseek'

    - id: typert
      name: '@ntars/ondra-typert-registry'

    - id: typert-loader
      name: '@ntars/ondra-typert-loader'

    - id: typert-gateway
      name: '@ntars/ondra-api-gateway'

    # Method-level access control for non-owner Peers; the Gateway requires it,
    # and its Client half publishes the standard access Hooks.
    - id: remote-access
      name: '@ntars/ondra-api-remote-access'

    - id: session-title
      name: '@ntars/ondra-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      disabled: true
      name: '@ntars/ondra-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        # A ceiling against runaway output, not a length target: the prompt
        # keeps titles short, while reasoning a model cannot switch off also
        # counts as output. Stays within common model output limits.
        maxOutputTokens: 4096
        timeoutMs: 60000

    - id: user-questions
      name: '@ntars/ondra-user-questions'

    - id: agent
      name: '@ntars/ondra-agent'

    - id: plugin-package-inventory-deepseek
      disabled: true
      name: '@ntars/ondra-plugin-package-inventory-deepseek'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    - id: agent-default-model
      name: '@ntars/ondra-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-flash

    - id: jobs
      name: '@ntars/ondra-jobs-local'

    - id: llm-retry
      name: '@ntars/ondra-llm-retry'

    # Live Config forms persist through the active profile patch.

    # Live configuration forms persist through the launcher's profile.
    - id: config-editor
      name: '@ntars/ondra-config-editor'
      disabled: !!js "!ctx.get('profileContext')"

    - id: settings
      name: '@ntars/ondra-settings'
      disabled: !!js "!ctx.get('profileContext')"

    # Credential sources: managed `$ONDRA_HOME/.credentials.yaml`, then inherited
    # environment, project `.env`, and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: authorization
      name: '@ntars/ondra-authorization'

    - id: deepseek-account
      name: '@ntars/ondra-deepseek-account-platform'
      config:
        desktopPlatform: !!js "ctx.get('profileContext')?.name === 'desktop' && ['darwin', 'win32'].includes(process.platform) ? process.platform : null"

    - id: credentials
      name: '@ntars/ondra-credentials-local'

    # The pi-ai multi-provider twin, mounted dormant: zero routes (and no extra
    # models in the picker) until a `llm-pi-ai:` settings section supplies provider
    # profiles — then those routes register live, keys resolving per request
    # through their apiKeyEnv references, and drop again when the section empties.
    # Supplying those profiles is exactly what the web Models page does. Which
    # adapters exist is composition; which providers run is the user's settings
    # document.
    - id: llm-pi-ai
      name: '@ntars/ondra-llm-pi-ai'

    - id: session-persistence-jsonl
      name: '@ntars/ondra-session-persistence-jsonl'
      config:
        root: !!js ondraHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@ntars/ondra-attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@ntars/ondra-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: working-directory
      name: '@ntars/ondra-working-directory'

    - id: tool-working-directory
      disabled: true
      name: '@ntars/ondra-tool-working-directory'

    - id: session-projection
      name: '@ntars/ondra-session-projection'

    # Durable KV storage: the storage hub, the json backend, and the
    # schema-validated domain form over them. Session-layer persistence (the
    # projection cache below; workspace in web layers)
    # routes through this stack, so it belongs to the shared base.
    - id: storage
      name: '@ntars/ondra-storage'

    - id: storage-json
      name: '@ntars/ondra-storage-json'
      config:
        root: !!js ondraHomePath('storages')

    - id: storage-domain
      name: '@ntars/ondra-storage-domain'
      config:
        backend: json

    # Persisted projection cache: throttled write-behind over the
    # session_projcache domain (per-record layout — one version-stamped
    # checkpoint document per session), serving the session listing's
    # projection column.
    - id: session-projection-cache
      name: '@ntars/ondra-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: subprocess
      name: '@ntars/ondra-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # Defaults to read-only: a fresh session may look but not write until the
    # person raises the preset in the composer. The environment remains an
    # explicit deployment override.
    - id: sandbox
      name: '@ntars/ondra-sandbox-local'

    - id: sandbox-policy
      name: '@ntars/ondra-sandbox-policy'
      config:
        mode: !!js process.env.ONDRA_PERMISSION_MODE ?? 'read-only'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@ntars/ondra-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    # The pwsh stack's executor: enabled exactly where the bash twin stands
    # down, so win32 always has one `shell` provider and the tool row that
    # injects it never mounts without one.
    - id: pwsh-sandbox
      name: '@ntars/ondra-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@ntars/ondra-user-approval'
      config:
        policy: !!js "(process.env.ONDRA_PERMISSION_MODE ?? 'read-only') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@ntars/ondra-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@ntars/ondra-shell-env'

    - id: tool-bash
      name: '@ntars/ondra-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@ntars/ondra-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@ntars/ondra-tool-jobs'

    - id: fs-observation-policy
      disabled: true
      name: '@ntars/ondra-fs-observation-policy'

    - id: tool-fs
      name: '@ntars/ondra-tool-fs'

    - id: tool-fs-search
      name: '@ntars/ondra-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@ntars/ondra-agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: '@ntars/ondra-skill'

    - id: skill-filesystem
      name: '@ntars/ondra-skill-filesystem'

    - id: tool-skill
      name: '@ntars/ondra-tool-skill'

    - id: commands
      name: '@ntars/ondra-commands'

    - id: command-feedback
      name: '@ntars/ondra-command-feedback'

    - id: goal
      name: '@ntars/ondra-goal'

    - id: goal-round-driver
      name: '@ntars/ondra-goal-round-driver'

    - id: command-goal
      name: '@ntars/ondra-command-goal'

    - id: plan-mode
      name: '@ntars/ondra-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@ntars/ondra-token-meter'

    - id: compaction-basic
      name: '@ntars/ondra-compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@ntars/ondra-command-compact'

    - id: subagent
      name: '@ntars/ondra-subagent'

    - id: subagent-spawn-in-process
      name: '@ntars/ondra-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@ntars/ondra-subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@ntars/ondra-tool-subagent-control'

    - id: tool-subagent
      name: '@ntars/ondra-tool-subagent'
      config:
        provider: spawn
        toolName: subagent

    # Fork omits model-selection arguments for KV Cache reuse. Parent and child
    # share the messaging tools; return guidance follows the inherited history.
    # See packages/subagent/tool-subagent/README.md
    # and .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@ntars/ondra-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork

    - id: ptc-runtime
      name: '@ntars/ondra-ptc-runtime-node'

    - id: workflow-ptc
      name: '@ntars/ondra-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@ntars/ondra-tool-workflow'

    - id: timeout-policy
      name: '@ntars/ondra-tool-call-timeout-policy'

    - id: spill-local
      name: '@ntars/ondra-spill-local'

    - id: spill-policy
      name: '@ntars/ondra-spill-policy'
      config:
        maxInlineTokens: 12500

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@ntars/ondra-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@ntars/ondra-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    # When an image-capable route rejects a request as over its image budget,
    # replace the oldest images with placeholders on the surface and retry.
    - id: image-offload
      disabled: true
      name: '@ntars/ondra-compaction-image-offload'

    - id: tool-todo
      name: '@ntars/ondra-tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@ntars/ondra-tool-goal'

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      disabled: true
      name: '@ntars/ondra-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # The shared base enables the stable model-facing web_search and web_fetch
    # tools. The Web app disables this host row and composes both tools per agent
    # preset; products with a stricter network policy override tool-web. DeepSeek
    # search resolves the same DEEPSEEK_API_KEY
    # credential the Models page manages for chat, at each search; its Messages
    # endpoint is configured independently from the model route, so it takes its own
    # base-URL override. Anonymous fetch accepts only public HTTP(S) destinations,
    # resolves and validates every destination, and pins every actual connection.
    # Search is a full auxiliary model request with server-side retrieval, so this
    # shipped DeepSeek route gets 60s while the provider-neutral tool default
    # remains 30s. The DeepSeek Search and Fetch APIs register as
    # deepseek-search-api and deepseek-fetch-api with the same credential; the Web
    # search settings switch selects both in place of these defaults.
    - id: web
      name: '@ntars/ondra-web'
      config:
        searchProvider: deepseek-official
        fetchProvider: http

    - id: web-search-deepseek
      disabled: true
      name: '@ntars/ondra-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-deepseek-api
      disabled: true
      name: '@ntars/ondra-web-deepseek-api'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-fetch-http
      disabled: true
      name: '@ntars/ondra-web-fetch-http'

    - id: tool-web
      name: '@ntars/ondra-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000

    - id: mcp-resources
      disabled: true
      name: '@ntars/ondra-mcp-resources'

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # Shared tool definitions and the deployment’s native executor.
    - id: tools
      name: '@ntars/ondra-tools'

    - id: tool-executor-native
      name: '@ntars/ondra-tool-executor-native'

    - id: tool-executor-ptc
      name: '@ntars/ondra-tool-executor-ptc'
      disabled: true

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    #
    # The product says who it is. Without this block the model knew only the
    # runtime it was compiled against, so "what app am I in" came back as the
    # library name. The identity line names the product; the persona prefix is
    # the brief a person would give a new colleague — what this app is, who
    # makes it, and which layer the runtime occupies.
    - id: system-prompt
      name: '@ntars/ondra-system-prompt'
      config:
        identity: 空谷 Ondra
        personaPrefix: |
          你正在「空谷 Ondra」这款软件里与用户对话。

          空谷 Ondra（取自成语「空谷足音」）是星玖工作室（Ntarstudio）出品的开源 AI 陪伴体应用，可一键部署、高度自定义；官网 https://ai.ntars.cn/ ，仓库 https://github.com/ntars/Ondra ，许可 AGPL-3.0。它的能力来自内置界面与 130 个 ondra-* 插件：记忆、人格、情绪、对话链、表达与生活、通道接入、端侧扩展与运行时治理。

          空谷 Ondra 跑在 ondra 运行时的 Cordis 插件体系之上。ondra 运行时只是插件容器与运行时底座，不是这款产品本身：用户打开的是空谷 Ondra，看到的是空谷的界面、人设与记忆。被问到「你是什么」「你在哪个软件里」时，回答空谷 Ondra；只有用户明确问起底层运行时，才说明它依赖 ondra 这套插件容器。

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@ntars/ondra-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@ntars/ondra-fs-sandbox'

    # The native DeepSeek adapter. No key or endpoint is inlined: both resolve per
    # request from the `llm-deepseek:` settings section over this entry, with the
    # key coming from the credential store below. Thinking defaults are a deployment
    # choice.
    - id: llm-deepseek
      name: '@ntars/ondra-llm-deepseek-api-key'

    - id: llm-deepseek-account
      name: '@ntars/ondra-llm-deepseek-account'
