# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@ntars/ondra-system-prompt'

- id: fs
  name: '@ntars/ondra-fs-local'

- id: session-projections
  name: '@ntars/ondra-session-projection'

- id: working-directory
  name: '@ntars/ondra-working-directory'

- id: tools
  name: '@ntars/ondra-tools'

- id: tool-executor-native
  name: '@ntars/ondra-tool-executor-native'

- id: subprocess
  name: '@ntars/ondra-subprocess-local'

- id: bash
  name: '@ntars/ondra-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@ntars/ondra-shell-env'

- id: tasks
  name: '@ntars/ondra-jobs-local'

- id: tool-jobs
  name: '@ntars/ondra-tool-jobs'

- id: tool-pwsh
  name: '@ntars/ondra-tool-pwsh'
