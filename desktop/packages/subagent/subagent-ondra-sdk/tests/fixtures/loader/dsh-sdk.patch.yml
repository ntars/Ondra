# Test-only SDK provider patch over the shipped headless profile. The child
# is a complete sdk profile; the parent omits `cwd` to exercise inheritance.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: mock
        model: mock-delegate
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: tool-subagent
  disabled: true

- insert:
    - id: mock-llm
      name: './mock-delegating-llm.ts'

    - id: subagent-model-selection-settings
      name: '@ntars/ondra-tool-subagent/model-selection-settings'
      config:
        enabled: true
        allowedModels:
          - provider: mock
            model: mock-routed

    - id: test-tool-subagent
      name: './scoped-tool-subagent.ts'
      config:
        provider: ondra-sdk
        toolName: subagent
        agentOptions:
          maxTokens: 777
        maxDepth: 'provider-managed'

    # providerName is omitted to exercise the shipped `ondra-sdk` default.
    - id: subagent-ondra-sdk
      name: '@ntars/ondra-subagent-sdk'
      config:
        profile: sdk
        patches: !!js JSON.parse(process.env.ONDRA_TEST_CHILD_PATCHES ?? '[]')
        ondraHome: !!js process.env.ONDRA_TEST_CHILD_HOME
        provider: mock
        model: mock-routed
        env:
          ONDRA_TELEMETRY_DISABLED: '1'
          ONDRA_TEST_CHILD_FAILURE: !!js String(process.env.ONDRA_TEST_CHILD_FAILURE ?? '')

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.ONDRA_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
