# Workspace-context snapshot patch: the harness exports ONDRA_HOME=<cwd>/.ondra and
# ONDRA_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@ntars/ondra-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@ntars/ondra-session-persistence-jsonl'
  config:
    root: !!js ondraHomePath('sessions')
    compression: !!js 'process.env.ONDRA_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@ntars/ondra-agent-instructions'
  config:
    maxBytes: 65536
    projectRootMarkers:
      - .ondra-project

- id: system-prompt
  name: '@ntars/ondra-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
