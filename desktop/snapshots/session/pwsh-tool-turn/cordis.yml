# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@ntars/ondra-llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@ntars/ondra-subprocess-local'

- id: bash-sandbox
  name: '@ntars/ondra-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@ntars/ondra-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@ntars/ondra-shell-env'

- id: agent-default-model
  name: '@ntars/ondra-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@ntars/ondra-session-persistence-jsonl'
  config:
    root: !!js ondraHomePath('sessions')
    compression: !!js 'process.env.ONDRA_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@ntars/ondra-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@ntars/ondra-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: goal
  name: '@ntars/ondra-goal'
  disabled: true

- id: goal-round-driver
  name: '@ntars/ondra-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@ntars/ondra-command-goal'
  disabled: true

- id: tool-goal
  name: '@ntars/ondra-tool-goal'
  disabled: true

- id: skill
  name: '@ntars/ondra-skill'
  disabled: true

- id: skill-filesystem
  name: '@ntars/ondra-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@ntars/ondra-tool-skill'
  disabled: true

- id: tool-bash
  name: '@ntars/ondra-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@ntars/ondra-tool-pwsh'
  disabled: false
