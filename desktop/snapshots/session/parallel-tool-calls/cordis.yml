# Filesystem-scenario overlay: the sandboxed filesystem stack already lives in
# `ondra-base`, so this patch changes only the local tool-result spill
# storage those scenarios exercise.

- id: spill-local
  name: '@ntars/ondra-spill-local'
  config:
    root: !!js process.env.ONDRA_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@ntars/ondra-spill-policy'
  config:
    maxInlineTokens: !!js process.env.ONDRA_SNAPSHOT && 200 || 12500

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.ONDRA_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.ONDRA_SNAPSHOT_SPILL_LOCATOR_ROOT
