# Keyless replay combines PTC mode with the durable image store and an exact
# image-capable replay route. The scenario generates its tiny PNG inside the
# run_code program, then exercises read_image as a nested dispatch.
- id: llm-deepseek
  name: '@ntars/ondra-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: agent-default-model
  name: '@ntars/ondra-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@ntars/ondra-session-persistence-jsonl'
  config:
    root: !!js ondraHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@ntars/ondra-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

- id: system-prompt
  name: '@ntars/ondra-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@ntars/ondra-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                inputModalities: [text]
              - id: deepseek-v4-pro
                inputModalities: [text]
              - id: deepseek-v4-flash-vision-exp
                inputModalities: [text, image]

- id: attachment-local
  name: '@ntars/ondra-attachment-local'
