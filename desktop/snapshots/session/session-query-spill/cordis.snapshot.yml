# Keyless session-query snapshot patch: replay plus the filesystem spill
# settings inherited by this scenario. The ACP row re-pins the recorded flash model.
- id: llm-deepseek
  name: '@ntars/ondra-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@ntars/ondra-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@ntars/ondra-session-persistence-jsonl'
  config:
    root: !!js ondraHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@ntars/ondra-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@ntars/ondra-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@ntars/ondra-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: spill-local
  name: '@ntars/ondra-spill-local'
  config:
    root: !!js process.env.ONDRA_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@ntars/ondra-spill-policy'
  config:
    maxInlineTokens: 200

# Keyless counterpart to session-query.cordis.yml: the nested snapshot overlay
# supplies replay plus deterministic private spill storage and its byte limit.
- insert:
    - id: tool-session-query
      name: '@ntars/ondra-tool-session-query'

- id: timeout-policy
  name: '@ntars/ondra-tool-call-timeout-policy'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.ONDRA_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.ONDRA_SNAPSHOT_SPILL_LOCATOR_ROOT

- insert:
    - id: query-spill-verification-path
      name: ./resolve-spill-command.mjs
