# Replay layer for the TypeScript SDK minimal customization patch.

- id: llm-deepseek
  name: '@ntars/ondra-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@ntars/ondra-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

- id: session-log-deepseek
  config:
    enabled: false
