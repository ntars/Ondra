# TypeScript SDK snapshot-record patch over `ondra --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@ntars/ondra-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@ntars/ondra-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@ntars/ondra-session-persistence-jsonl'
  config:
    root: !!js ondraHomePath('sessions')
    compression: !!js "process.env.ONDRA_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@ntars/ondra-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

# The process-local clock is deterministic; native timers remain live.
- insert:
    - id: snapshot-clock
      name: './clock.mjs'

- id: time-context
  config:
    timeZone: UTC
