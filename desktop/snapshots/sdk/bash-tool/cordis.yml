# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@ntars/ondra-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@ntars/ondra-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@ntars/ondra-session-persistence-jsonl'
  config:
    root: !!js ondraHomePath('sessions')
    compression: !!js "process.env.ONDRA_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@ntars/ondra-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- id: session-log-deepseek
  config:
    enabled: false
