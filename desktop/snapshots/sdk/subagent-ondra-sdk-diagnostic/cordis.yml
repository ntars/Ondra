# TypeScript SDK snapshot patch for automatic Ondra SDK failure notices.

- id: skill-filesystem
  name: '@ntars/ondra-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@ntars/ondra-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@ntars/ondra-session-persistence-jsonl'
  config:
    root: !!js ondraHomePath('sessions')
    compression: !!js "process.env.ONDRA_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-log-deepseek
  name: '@ntars/ondra-session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: subagent-ondra-sdk-diagnostic
      name: '@ntars/ondra-subagent-sdk'
      config:
        providerName: ondra-sdk-diagnostic
        profile: sdk
        patches:
          - !!js process.env.ONDRA_TEST_CHILD_PATCH
        ondraHome: !!js ondraHomePath('children/first')
        provider: mock
        model: mock-echo
        env:
          ONDRA_TELEMETRY_DISABLED: '1'
          ONDRA_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-ondra-sdk-diagnostic
      name: '@ntars/ondra-tool-subagent'
      config:
        provider: ondra-sdk-diagnostic
        toolName: subagent-ondra-sdk
        maxDepth: provider-managed
    - id: subagent-ondra-sdk-diagnostic-second
      name: '@ntars/ondra-subagent-sdk'
      config:
        providerName: ondra-sdk-diagnostic-second
        profile: sdk
        patches:
          - !!js process.env.ONDRA_TEST_CHILD_PATCH
        ondraHome: !!js ondraHomePath('children/second')
        provider: mock
        model: mock-echo
        env:
          ONDRA_TELEMETRY_DISABLED: '1'
          ONDRA_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-ondra-sdk-diagnostic-second
      name: '@ntars/ondra-tool-subagent'
      config:
        provider: ondra-sdk-diagnostic-second
        toolName: subagent-ondra-sdk_second
        maxDepth: provider-managed
    - id: await-external-subagents
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-settlement-barrier.ts'
