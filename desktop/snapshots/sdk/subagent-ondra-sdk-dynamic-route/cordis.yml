# SDK-profile patch for a deterministic parent model that selects a route for
# a separate SDK child runtime. Both runtimes persist their request headers.

- id: llm-deepseek
  name: '@ntars/ondra-llm-deepseek-api-key'
  disabled: true

- id: tool-subagent
  name: '@ntars/ondra-tool-subagent'
  disabled: true

- id: sdk-jsonrpc-server
  name: '@ntars/ondra-sdk-jsonrpc-server'
  disabled: true

- id: session-persistence-jsonl
  name: '@ntars/ondra-session-persistence-jsonl'
  config:
    root: !!js ondraHomePath('sessions')
    compression: none

- insert:
    - id: mock-llm
      name: '../../../packages/subagent/subagent-ondra-sdk/tests/fixtures/loader/mock-delegating-llm.ts'
      disabled: !!js process.env.ONDRA_SNAPSHOT !== 'record'

    - id: subagent-ondra-sdk
      name: '@ntars/ondra-subagent-sdk'
      config:
        profile: sdk
        patches: !!js JSON.parse(process.env.ONDRA_TEST_CHILD_PATCHES ?? '[]')
        ondraHome: !!js process.env.ONDRA_TEST_CHILD_HOME
        provider: mock
        model: mock-routed
        env:
          ONDRA_TELEMETRY_DISABLED: '1'

    - id: subagent-model-selection-settings
      name: '@ntars/ondra-tool-subagent/model-selection-settings'
      config:
        enabled: true
        allowedModels:
          - provider: mock
            model: mock-routed

    - id: tool-subagent-ondra-sdk
      name: '../../../packages/subagent/subagent-ondra-sdk/tests/fixtures/loader/scoped-tool-subagent.ts'
      config:
        provider: ondra-sdk
        toolName: subagent
        agentOptions:
          maxTokens: 777
        maxDepth: 'provider-managed'

    - id: sdk-jsonrpc-server-dynamic-live
      name: '@ntars/ondra-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      disabled: !!js process.env.ONDRA_SNAPSHOT !== 'record'
      config:
        maxTokensAsSuccess: true

- id: session-log-deepseek
  config:
    enabled: false

- insert:
    - id: await-external-subagents
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-settlement-barrier.ts'
