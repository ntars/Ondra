[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ondra-sdk"
version = "0.0.0.dev0"
description = "Python SDK for Ondra"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ntars" }]
dependencies = [
  "pydantic>=2.12,<3",
  "ondra-runtime-bin==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/ntars/Ondra"
Documentation = "https://github.com/ntars/Ondra/blob/master/docs/user/guide/python-sdk.md"
Issues = "https://github.com/ntars/Ondra/issues"
Source = "https://github.com/ntars/Ondra"

[dependency-groups]
test = ["pytest>=8.0", "Pillow==12.3.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ondra_harness"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
ondra-runtime-bin = { path = "../sdk-runtime", editable = true }
